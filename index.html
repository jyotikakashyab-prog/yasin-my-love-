<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Yasin 🌷❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Georgia, "Times New Roman", serif;
    color: white;

    background:
        radial-gradient(circle at 50% 10%, #642c79 0%, #301445 35%, #120719 70%, #050207 100%);
}

/* =========================
   NIGHT SKY
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

/* STARS */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

.s1 { top: 7%; left: 7%; }
.s2 { top: 14%; left: 19%; animation-delay: .4s; }
.s3 { top: 9%; left: 42%; animation-delay: .8s; }
.s4 { top: 18%; left: 63%; animation-delay: .2s; }
.s5 { top: 8%; left: 87%; animation-delay: 1s; }
.s6 { top: 31%; left: 11%; animation-delay: .7s; }
.s7 { top: 29%; left: 50%; animation-delay: 1.1s; }
.s8 { top: 34%; left: 82%; animation-delay: .3s; }
.s9 { top: 45%; left: 27%; animation-delay: .9s; }
.s10 { top: 42%; left: 71%; animation-delay: .5s; }
.s11 { top: 56%; left: 8%; animation-delay: 1.3s; }
.s12 { top: 52%; left: 91%; animation-delay: .6s; }

@keyframes twinkle {

    from {
        opacity: .2;
        transform: scale(.6);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;
    top: 35px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #fff1bd;
    box-shadow:
        0 0 20px #ffe9a0,
        0 0 45px rgba(255,230,150,.4);
}

.moon::after {
    content: "";
    position: absolute;
    top: -9px;
    left: 19px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #301445;
}

/* =========================
   FAIRY LIGHTS
========================= */

.lights {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;

    display: flex;
    justify-content: space-around;
}

.light {
    width: 9px;
    height: 9px;
    margin-top: 18px;
    border-radius: 50%;
    background: #ffd86a;

    box-shadow:
        0 0 8px #ffd86a,
        0 0 18px #ffd86a;

    animation: lightGlow 1.5s infinite alternate;
}

.light:nth-child(even) {
    animation-delay: .6s;
}

@keyframes lightGlow {

    from {
        opacity: .35;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* =========================
   BALLOONS
========================= */

.balloon {
    position: absolute;
    width: 48px;
    height: 62px;
    border-radius: 50%;
    opacity: .9;

    animation: balloonFloat 4s ease-in-out infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    top: 58px;
    left: 24px;
    width: 1px;
    height: 100px;
    background: rgba(255,255,255,.4);
}

.b1 {
    left: 5%;
    top: 18%;
    background: #ff6fae;
}

.b2 {
    right: 7%;
    top: 23%;
    background: #9b70ff;
    animation-delay: 1s;
}

.b3 {
    left: 13%;
    top: 43%;
    background: #ffb85c;
    animation-delay: 1.7s;
}

.b4 {
    right: 13%;
    top: 45%;
    background: #67d9ff;
    animation-delay: .5s;
}

@keyframes balloonFloat {

    0%, 100% {
        transform: translateY(0) rotate(-3deg);
    }

    50% {
        transform: translateY(-16px) rotate(4deg);
    }
}

/* =========================
   DISTANT CITY LIGHTS
========================= */

.city {
    position: fixed;
    bottom: 95px;
    left: 0;
    width: 100%;
    height: 90px;
    z-index: 1;
    pointer-events: none;
}

.building {
    position: absolute;
    bottom: 0;
    background: #0c0710;
}

.building:nth-child(1) {
    left: 0;
    width: 13%;
    height: 50px;
}

.building:nth-child(2) {
    left: 13%;
    width: 10%;
    height: 70px;
}

.building:nth-child(3) {
    left: 23%;
    width: 14%;
    height: 45px;
}

.building:nth-child(4) {
    left: 37%;
    width: 11%;
    height: 78px;
}

.building:nth-child(5) {
    left: 48%;
    width: 15%;
    height: 55px;
}

.building:nth-child(6) {
    left: 63%;
    width: 12%;
    height: 73px;
}

.building:nth-child(7) {
    left: 75%;
    width: 13%;
    height: 48px;
}

.building:nth-child(8) {
    left: 88%;
    width: 12%;
    height: 68px;
}

/* =========================
   BIRTHDAY TABLE
========================= */

.birthday-table {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;

    background:
        linear-gradient(#3b1c2e, #160a12);

    border-top: 3px solid #8d4d5e;

    z-index: 3;
}

/* =========================
   CAKE
========================= */

.cake {
    position: absolute;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%);

    width: 145px;
    height: 62px;

    background:
        linear-gradient(#b64b73, #64203f);

    border-radius: 12px 12px 18px 18px;

    box-shadow:
        0 0 25px rgba(255,90,170,.35);
}

.cake::before {
    content: "";

    position: absolute;
    top: -16px;
    left: 8px;

    width: 129px;
    height: 24px;

    background: #ffd3df;

    border-radius: 50%;
}

.candle {
    position: absolute;

    bottom: 123px;
    left: 50%;

    width: 7px;
    height: 30px;

    background: #ffe69b;
    z-index: 4;
}

.flame {
    position: absolute;

    bottom: 150px;
    left: calc(50% - 5px);

    width: 15px;
    height: 20px;

    background: #ffae28;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow:
        0 0 12px #ff9c20,
        0 0 25px #ff9c20;

    animation: flame 1s infinite alternate;
}

@keyframes flame {

    to {
        transform: rotate(-45deg) scale(1.15);
    }
}

/* =========================
   COUPLE BACKGROUND
========================= */

.couple {
    position: fixed;

    bottom: 82px;
    left: 50%;

    transform: translateX(-50%);

    width: 230px;
    height: 165px;

    z-index: 2;

    pointer-events: none;

    filter: drop-shadow(0 0 12px rgba(0,0,0,.7));
}

.person {
    position: absolute;
    bottom: 0;
}

/* PERSON 1 */

.person.one {
    left: 25px;
}

.person.one .head {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #08060c;
}

.person.one .body {
    width: 82px;
    height: 105px;

    background: #08060c;

    border-radius: 45px 45px 10px 10px;
}

/* PERSON 2 */

.person.two {
    right: 25px;
}

.person.two .head {
    width: 51px;
    height: 51px;

    border-radius: 50%;

    background: #08060c;
}

.person.two .body {
    width: 76px;
    height: 101px;

    background: #08060c;

    border-radius: 45px 45px 10px 10px;
}

/* COUPLE ARMS */

.arm {
    position: absolute;

    width: 55px;
    height: 12px;

    background: #08060c;

    border-radius: 20px;

    top: 65px;
}

.arm.one {
    left: 73px;
    transform: rotate(18deg);
}

.arm.two {
    right: 70px;
    transform: rotate(-18deg);
}

/* HEART */

.couple-heart {
    position: absolute;

    top: 25px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 27px;

    filter:
        drop-shadow(0 0 7px #ff75b9)
        drop-shadow(0 0 14px #ff75b9);

    animation: heartBeat 1.5s infinite;
}

@keyframes heartBeat {

    50% {
        transform:
            translateX(-50%)
            scale(1.3);
    }
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;

    z-index: 6;

    min-height: 100vh;

    padding:
        95px
        18px
        180px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   TITLE
========================= */

h1 {
    font-size: clamp(38px, 10vw, 68px);

    color: #fff0fa;

    text-shadow:
        0 0 15px #ff79c7,
        0 0 35px #b85cff;

    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {

    from {
        text-shadow:
            0 0 12px #ff79c7;
    }

    to {
        text-shadow:
            0 0 25px #ff5bb8,
            0 0 50px #b85cff;
    }
}

.subtitle {
    margin-top: 12px;

    color: #ffd5ee;

    font-size: 17px;

    margin-bottom: 30px;
}

/* =========================
   ENVELOPE
========================= */

.envelope {
    width: min(330px, 88vw);
    height: 220px;

    position: relative;

    cursor: pointer;

    margin-top: 10px;

    transition: transform .4s ease;
}

.envelope:hover {
    transform: scale(1.05);
}

.env-body {
    position: absolute;

    bottom: 0;

    width: 100%;
    height: 165px;

    background:
        linear-gradient(
            135deg,
            #ff78b8,
            #a849c7
        );

    border-radius: 10px;

    box-shadow:
        0 18px 40px rgba(0,0,0,.5);
}

.env-flap {
    position: absolute;

    top: 28px;

    width: 100%;
    height: 125px;

    background: #db62ac;

    clip-path:
        polygon(
            0 0,
            50% 70%,
            100% 0
        );

    z-index: 3;
}

.env-heart {
    position: absolute;

    z-index: 4;

    top: 92px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 42px;

    filter:
        drop-shadow(0 0 8px white);
}

.click-text {
    margin-top: 8px;

    color: #ffd5ed;

    font-size: 14px;
}

/* =========================
   MESSAGE BOX
========================= */

.message {
    display: none;

    width: min(700px, 94vw);

    margin-top: 35px;

    padding: 35px 24px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,190,235,.4);

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 40px
        rgba(255,80,180,.2);

    animation: appear 1s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message h2 {
    color: #ff9fdc;

    font-size: 31px;

    margin-bottom: 25px;
}

.message p {
    color: #fff3fa;

    font-size: 16px;

    line-height: 1.95;

    margin: 18px 0;
}

.highlight {
    color: #ffacd9;

    font-weight: bold;
}

/* =========================
   FLOWER GARDEN
========================= */

.flower-garden {
    display: flex;

    justify-content: center;
    align-items: flex-end;

    gap: 10px;

    margin-top: 35px;

    height: 145px;
}

.flower-wrap {
    position: relative;

    width: 55px;
    height: 135px;

    animation:
        sway 3s
        ease-in-out
        infinite;
}

.flower-wrap:nth-child(2) {
    animation-delay: .3s;
}

.flower-wrap:nth-child(3) {
    animation-delay: .6s;
}

.flower-wrap:nth-child(4) {
    animation-delay: .9s;
}

.flower-wrap:nth-child(5) {
    animation-delay: 1.2s;
}

.stem {
    position: absolute;

    left: 25px;
    bottom: 0;

    width: 5px;
    height: 85px;

    background: #55a85c;

    border-radius: 5px;
}

.leaf {
    position: absolute;

    bottom: 25px;

    width: 30px;
    height: 52px;

    background: #55a85c;

    border-radius:
        100% 0 100% 0;
}

.leaf.left {
    left: 0;

    transform: rotate(-25deg);
}

.leaf.right {
    right: -3px;

    transform:
        rotate(25deg)
        scaleX(-1);
}

/* TULIP */

.tulip {
    position: absolute;

    top: 0;
    left: 7px;

    width: 42px;
    height: 45px;

    background:
        linear-gradient(
            135deg,
            #ff9bca,
            #df3d91
        );

    border-radius:
        45% 45% 48% 48%;

    box-shadow:
        0 0 15px
        rgba(255,90,180,.5);
}

.tulip::before,
.tulip::after {
    content: "";

    position: absolute;

    top: -6px;

    width: 23px;
    height: 32px;

    background: #ff70b5;

    border-radius:
        50% 50% 20% 50%;
}

.tulip::before {
    left: 1px;

    transform: rotate(-18deg);
}

.tulip::after {
    right: 1px;

    transform: rotate(18deg);
}

/* ROSE */

.rose {
    position: absolute;

    top: 3px;
    left: 8px;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffd1dc 5%,
            #ff527f 20%,
            #c91f54 48%,
            #76112f 78%
        );

    box-shadow:
        0 0 18px
        rgba(255,50,100,.5);
}

.rose::before,
.rose::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,180,200,.45);
}

.rose::before {
    inset: 7px;
}

.rose::after {
    inset: 14px;
}

@keyframes sway {

    0%,100% {
        transform: rotate(-3deg);
    }
</style>
</head>

<script>

/* =========================
   OPEN LETTER
========================= */

function openLetter() {

    const letter =
        document.getElementById("message");

    /* Show the letter */

    letter.style.display = "block";

    letter.classList.add("opening");


    /* Change envelope text */

    const clickText =
        document.querySelector(".click-text");

    if (clickText) {

        clickText.innerHTML =
            "Your letter is open 💌✨";

    }


    /* Birthday confetti */

    createConfetti();


    /* Scroll smoothly to letter */

    setTimeout(function() {

        letter.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 300);

}
